    contexts:
      - "GTA IV apostou em uma física mais pesada e em uma cidade mais contida."
      - "A comparação entre GTA IV e os títulos seguintes exige contexto histórico."
  - term: GTA V
    tier: title_numeral
    candidates: ["GTA V", "GTA cinco", "Gê Tê Á cinco"]
    contexts:
      - "GTA V ampliou a escala e alternou entre três protagonistas."
      - "No trailer, GTA V serve como referência para a comparação técnica."
  - term: GTA VI
    tier: title_numeral
    candidates: ["GTA VI", "GTA seis", "Gê Tê Á seis"]
    contexts:
      - "GTA VI ainda está em desenvolvimento e detalhes podem mudar até o lançamento."
      - "O material oficial de GTA VI permite observações, não certezas sobre toda mecânica."
  - term: GTA 5
    tier: title_number
    candidates: ["GTA 5", "GTA cinco", "Gê Tê Á cinco"]
    contexts:
