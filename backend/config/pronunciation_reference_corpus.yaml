  - term: GTA 6
    tier: title_number
    candidates: ["GTA 6", "GTA seis", "Gê Tê Á seis"]
    contexts:
      - "GTA 6 é uma forma editorial alternativa ao numeral romano no título."
  - term: NPC
    tier: initialism
    contexts:
      - "Um NPC aparentemente irrelevante acabou entregando a pista principal."
      - "Quando o NPC mudou de rota, a missão inteira tomou outro rumo."
  - term: trailer
    tier: mixed_english
    candidates: ["trailer", "trêiler", "tréiler"]
    contexts:
      - "O trailer oficial mostra uma cidade movimentada, mas não confirma todas as mecânicas."
      - "Cada quadro do trailer precisa ser descrito sem transformar inferência em fato."
  - term: hardware
    tier: mixed_english
    candidates: ["hardware", "rárduér", "hárd-uér"]
    contexts:
      - "O hardware atual reduz gargalos, mas não elimina decisões de otimização."
      - "Uma conclusão sobre hardware precisa separar evidência técnica de especulação."
  - term: Xbox 360
    tier: proper_noun
    candidates: ["Xbox 360", "Équis bóquis trezentos e sessenta"]
    contexts:
      - "O Xbox 360 marcou uma geração importante para jogos de mundo aberto."
  - term: Red Dead Redemption
    tier: proper_noun
    contexts:
      - "Red Dead Redemption usa o silêncio para construir tensão durante a viagem."
      - "Em Red Dead Redemption, cada cidade tem um ritmo diferente de exploração."
  - term: Grand Theft Auto
    tier: proper_noun
    contexts:
      - "Grand Theft Auto mistura exploração, perseguições e missões com objetivos bem distintos."
      - "A série Grand Theft Auto ficou conhecida pela liberdade oferecida ao jogador."
  - term: level design
    tier: mixed_english
    contexts:
      - "O level design funciona melhor quando a rota principal permanece legível."
      - "Um bom level design ensina a mecânica sem interromper a exploração."
  - term: checkpoint
    tier: mixed_english
    contexts:
      - "O checkpoint apareceu antes da luta e evitou repetir todo o caminho."
      - "Depois do checkpoint, a missão ficou mais intensa e direta."
  - term: fast travel
    tier: mixed_english
    contexts:
      - "O fast travel economiza tempo, mas remove parte da descoberta do mapa."
      - "Eu desbloqueei o fast travel antes de voltar para a região inicial."
