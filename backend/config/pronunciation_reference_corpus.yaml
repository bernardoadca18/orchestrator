    tier: mixed_english
    contexts:
      - "A API respondeu ao HTTP Range e retomou o download sem começar do zero."
      - "Quando o HTTP Range falha, o cliente precisa validar o conteúdo recebido."
  - term: checksum
    tier: mixed_english
    contexts:
      - "O checksum confirmou que o arquivo chegou sem alterações."
      - "Eu comparei o checksum antes de publicar o áudio no armazenamento final."
  - term: SHA-256
    tier: initialism
    contexts:
      - "O SHA-256 permaneceu consistente depois da cópia para o volume de saída."
      - "Usei SHA-256 para identificar o mesmo arquivo em duas execuções."
  - term: PostgreSQL
    tier: proper_noun
    contexts:
      - "Os dados foram persistidos no PostgreSQL depois da validação."
      - "O PostgreSQL registrou o estado final da tarefa e o identificador do áudio."
