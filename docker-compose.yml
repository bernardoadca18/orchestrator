x-neovids-logging: &neovids-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: orchestrator-db
    restart: "no"
    logging: *neovids-logging
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: orchestrator
    ports:
      - "5434:5432"
    volumes:
      - orchestrator-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: orchestrator-redis
    restart: "no"
    logging: *neovids-logging
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./backend
    container_name: orchestrator-api
    restart: "no"
    init: true
    stop_grace_period: 1m
    logging: *neovids-logging
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://orchestrator:orchestrator@orchestrator-db:5432/orchestrator
      REDIS_URL: redis://orchestrator-redis:6379/0
      IDEAS_HUB_API_URL: ${IDEAS_HUB_API_URL_DOCKER:-http://host.docker.internal:8000}
      VOICE_API_URL: ${VOICE_API_URL_DOCKER:-http://host.docker.internal:8889}
      MEDIA_INDEXER_API_URL: ${MEDIA_INDEXER_API_URL_DOCKER:-http://host.docker.internal:8012}
      VIDEO_COMPOSER_API_URL: ${VIDEO_COMPOSER_API_URL_DOCKER:-http://host.docker.internal:8013}
      TRANSCRIPTION_LOCAL_FILES_ONLY: ${TRANSCRIPTION_LOCAL_FILES_ONLY:-false}
    ports:
      - "8011:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data/audio:/data/audio
      - ./data/music:/data/music:ro
      # Narrow, read-only view of the canonical Qwen reference corpus used by
      # the opt-in benchmark runner.  No other host paths are exposed.
      - ../qwen3-tts-workshop/data/references:/data/references:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker: &orchestrator-worker
    build: ./backend
    container_name: orchestrator-worker
    restart: "no"
    init: true
    stop_grace_period: 30m
    logging: *neovids-logging
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://orchestrator:orchestrator@orchestrator-db:5432/orchestrator
      REDIS_URL: redis://orchestrator-redis:6379/0
      IDEAS_HUB_API_URL: ${IDEAS_HUB_API_URL_DOCKER:-http://host.docker.internal:8000}
      VOICE_API_URL: ${VOICE_API_URL_DOCKER:-http://host.docker.internal:8889}
      MEDIA_INDEXER_API_URL: ${MEDIA_INDEXER_API_URL_DOCKER:-http://host.docker.internal:8012}
      VIDEO_COMPOSER_API_URL: ${VIDEO_COMPOSER_API_URL_DOCKER:-http://host.docker.internal:8013}
      TRANSCRIPTION_LOCAL_FILES_ONLY: ${TRANSCRIPTION_LOCAL_FILES_ONLY:-false}
    command: celery -A app.core.celery_app.celery_app worker -Q audio_producao --hostname=audio@%h --concurrency=1 -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data/audio:/data/audio
      - ./data/music:/data/music:ro
      - ./cache/huggingface:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.core.celery_app.celery_app inspect ping --timeout 5 --destination audio@$$HOSTNAME | grep -q pong",
        ]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s

  control-worker:
    <<: *orchestrator-worker
    container_name: orchestrator-control-worker
    stop_grace_period: 1m
    command: celery -A app.core.celery_app.celery_app worker -Q production_control --hostname=control@%h --concurrency=1 -l info
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.core.celery_app.celery_app inspect ping --timeout 5 --destination control@$$HOSTNAME | grep -q pong",
        ]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: orchestrator-frontend
    restart: "no"
    init: true
    stop_grace_period: 30s
    logging: *neovids-logging
    env_file: .env
    ports:
      - "5174:5174"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5174').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

volumes:
  orchestrator-db-data:
    name: orchestrator-db-data
